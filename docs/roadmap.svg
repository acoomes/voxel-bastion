<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1820" font-family="Segoe UI, system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0a2e"/>
      <stop offset="1" stop-color="#2d1b69"/>
    </linearGradient>
    <linearGradient id="cardBg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2a1850" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#3a2470" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="gateBg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3a1850" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#5a2470" stop-opacity="0.85"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="1820" fill="url(#bg)"/>

  <!-- Subtle grid sparkles for atmosphere -->
  <g opacity="0.08" fill="#eeddff">
    <circle cx="80" cy="220" r="1.5"/>
    <circle cx="1140" cy="180" r="1.5"/>
    <circle cx="200" cy="450" r="1"/>
    <circle cx="980" cy="700" r="1.5"/>
    <circle cx="60" cy="900" r="1"/>
    <circle cx="1100" cy="1100" r="1.5"/>
    <circle cx="160" cy="1400" r="1"/>
    <circle cx="1050" cy="1600" r="1.5"/>
  </g>

  <!-- Title -->
  <text x="600" y="58" text-anchor="middle" fill="#eeddff" font-size="34" font-weight="900" letter-spacing="3">VOXEL BASTION · ROADMAP</text>
  <text x="600" y="88" text-anchor="middle" fill="#ccbbee" font-size="15" opacity="0.8">Prototype → Steam launch · solo full-time · ~12–18 months</text>

  <!-- Legend -->
  <g transform="translate(600, 110)">
    <g transform="translate(-280, 0)">
      <rect x="-12" y="-10" width="20" height="20" rx="3" fill="#44ffcc" opacity="0.85"/>
      <text x="14" y="4" fill="#ccbbee" font-size="12">Build / engineering</text>
    </g>
    <g transform="translate(-100, 0)">
      <rect x="-12" y="-10" width="20" height="20" rx="3" fill="#ffdd44" opacity="0.85"/>
      <text x="14" y="4" fill="#ccbbee" font-size="12">Marketing / production</text>
    </g>
    <g transform="translate(110, 0)">
      <polygon points="0,-12 12,0 0,12 -12,0" fill="#ff44cc" opacity="0.9"/>
      <text x="20" y="4" fill="#ccbbee" font-size="12">Decision gate</text>
    </g>
  </g>

  <!-- Timeline backbone -->
  <line x1="100" y1="170" x2="100" y2="1660" stroke="rgba(140, 120, 200, 0.35)" stroke-width="3"/>

  <!-- ============== PHASE 0 ============== -->
  <g>
    <line x1="100" y1="270" x2="140" y2="270" stroke="rgba(140, 120, 200, 0.35)" stroke-width="2"/>
    <polygon points="100,250 120,270 100,290 80,270" fill="#ff44cc" filter="url(#glow)"/>
    <text x="100" y="274" text-anchor="middle" fill="#1a0a2e" font-size="14" font-weight="900">0</text>

    <rect x="140" y="170" width="1020" height="200" rx="10" fill="url(#gateBg)" stroke="#ff44cc" stroke-width="1.5" opacity="0.95"/>
    <text x="160" y="200" fill="#ff66dd" font-size="20" font-weight="800">PHASE 0 · Pick the Hook</text>
    <text x="1140" y="200" text-anchor="end" fill="#ffdd44" font-size="13" font-weight="700">1–2 weeks</text>
    <text x="1140" y="220" text-anchor="end" fill="#ff44cc" font-size="11" font-weight="700" letter-spacing="1">★ DECISION GATE</text>
    <text x="160" y="226" fill="#ccbbee" font-size="13" font-style="italic" opacity="0.85">A generic TD won't sell. Pick the differentiator everything else builds on.</text>

    <g fill="#ddccee" font-size="13">
      <text x="170" y="260">▸ Evaluate 4 candidate hooks: roguelite, tower-crafting, co-op tactical, narrative</text>
      <text x="170" y="282">▸ Recommended: roguelite voxel TD — leverages existing prototype, hot market</text>
      <text x="170" y="304">▸ Write one-sentence pitch: "It's like X, but with Y"</text>
      <text x="170" y="326">▸ Validate pitch on 5–10 non-gamers; iterate until reaction is "huh, interesting"</text>
      <text x="170" y="350" fill="#44ffcc">Exit: pitch passes the non-gamer interest test.</text>
    </g>
  </g>

  <!-- ============== PHASE 1 ============== -->
  <g>
    <line x1="100" y1="490" x2="140" y2="490" stroke="rgba(140, 120, 200, 0.35)" stroke-width="2"/>
    <circle cx="100" cy="490" r="20" fill="#44ffcc" filter="url(#glow)"/>
    <text x="100" y="495" text-anchor="middle" fill="#1a0a2e" font-size="14" font-weight="900">1</text>

    <rect x="140" y="390" width="1020" height="200" rx="10" fill="url(#cardBg)" stroke="#44ffcc" stroke-width="1.5" opacity="0.9"/>
    <text x="160" y="420" fill="#66ffdd" font-size="20" font-weight="800">PHASE 1 · Alpha — Nail the Core Loop</text>
    <text x="1140" y="420" text-anchor="end" fill="#ffdd44" font-size="13" font-weight="700">2–3 months</text>
    <text x="160" y="446" fill="#ccbbee" font-size="13" font-style="italic" opacity="0.85">A 30-minute run that's genuinely fun. No polish, no music — just the loop.</text>

    <g fill="#ddccee" font-size="13">
      <text x="170" y="480">▸ Procedural map generation — multiple branching paths per run</text>
      <text x="170" y="502">▸ Run structure: 3 acts × ~8 waves, randomized per run</text>
      <text x="170" y="524">▸ Tower roster: current 3 + 4–5 more, each with 3+ upgrade branches</text>
      <text x="170" y="546">▸ Enemy roster: 8–10 types with rock-paper-scissors counters · voxel destruction signature</text>
      <text x="170" y="570" fill="#44ffcc">Exit: 5 runs back-to-back without repetition.</text>
    </g>
  </g>

  <!-- ============== PHASE 2 ============== -->
  <g>
    <line x1="100" y1="710" x2="140" y2="710" stroke="rgba(140, 120, 200, 0.35)" stroke-width="2"/>
    <polygon points="100,690 120,710 100,730 80,710" fill="#ff44cc" filter="url(#glow)"/>
    <text x="100" y="714" text-anchor="middle" fill="#1a0a2e" font-size="14" font-weight="900">2</text>

    <rect x="140" y="610" width="1020" height="200" rx="10" fill="url(#gateBg)" stroke="#ff44cc" stroke-width="1.5" opacity="0.95"/>
    <text x="160" y="640" fill="#ff66dd" font-size="20" font-weight="800">PHASE 2 · Vertical Slice + Steam Page Live</text>
    <text x="1140" y="640" text-anchor="end" fill="#ffdd44" font-size="13" font-weight="700">1–2 months</text>
    <text x="1140" y="660" text-anchor="end" fill="#ff44cc" font-size="11" font-weight="700" letter-spacing="1">★ DECISION GATE</text>
    <text x="160" y="666" fill="#ccbbee" font-size="13" font-style="italic" opacity="0.85">A 30-minute slice that looks shipped. Steam page begins collecting wishlists.</text>

    <g fill="#ddccee" font-size="13">
      <text x="170" y="700">▸ One polished biome (terrain, enemy variants, music)</text>
      <text x="170" y="722">▸ Tutorial first-run flow · save/resume · settings + accessibility basics</text>
      <text x="170" y="744" fill="#ffdd44">▸ Capsule art, screenshots, ~90s trailer (hire a freelancer for capsules — non-negotiable)</text>
      <text x="170" y="766" fill="#ffdd44">▸ Submit Steam page → wishlists begin accumulating (this takes 6–12 months)</text>
      <text x="170" y="790" fill="#44ffcc">Exit: trailer makes you want to play. Page converts ≥10% of impressions to wishlists.</text>
    </g>
  </g>

  <!-- ============== PHASE 3 ============== -->
  <g>
    <line x1="100" y1="930" x2="140" y2="930" stroke="rgba(140, 120, 200, 0.35)" stroke-width="2"/>
    <circle cx="100" cy="930" r="20" fill="#44ffcc" filter="url(#glow)"/>
    <text x="100" y="935" text-anchor="middle" fill="#1a0a2e" font-size="14" font-weight="900">3</text>

    <rect x="140" y="830" width="1020" height="200" rx="10" fill="url(#cardBg)" stroke="#44ffcc" stroke-width="1.5" opacity="0.9"/>
    <text x="160" y="860" fill="#66ffdd" font-size="20" font-weight="800">PHASE 3 · Content Expansion</text>
    <text x="1140" y="860" text-anchor="end" fill="#ffdd44" font-size="13" font-weight="700">3–4 months</text>
    <text x="160" y="886" fill="#ccbbee" font-size="13" font-style="italic" opacity="0.85">Depth and breadth. The slice becomes a full game.</text>

    <g fill="#ddccee" font-size="13">
      <text x="170" y="920">▸ 2–3 additional biomes with distinct enemies and visual identity</text>
      <text x="170" y="942">▸ Meta-progression tree · daily challenge mode · ascension difficulty ladder</text>
      <text x="170" y="964" fill="#ffdd44">▸ Original music: commission 5–10 tracks ($200–500/track)</text>
      <text x="170" y="986">▸ 60fps with 200+ enemies · controller support · Steam Deck verification</text>
      <text x="170" y="1010" fill="#44ffcc">Exit: 3+ hours of distinct gameplay before repetition sets in.</text>
    </g>
  </g>

  <!-- ============== PHASE 4 ============== -->
  <g>
    <line x1="100" y1="1150" x2="140" y2="1150" stroke="rgba(140, 120, 200, 0.35)" stroke-width="2"/>
    <polygon points="100,1130 120,1150 100,1170 80,1150" fill="#ff44cc" filter="url(#glow)"/>
    <text x="100" y="1154" text-anchor="middle" fill="#1a0a2e" font-size="14" font-weight="900">4</text>

    <rect x="140" y="1050" width="1020" height="200" rx="10" fill="url(#gateBg)" stroke="#ff44cc" stroke-width="1.5" opacity="0.95"/>
    <text x="160" y="1080" fill="#ff66dd" font-size="20" font-weight="800">PHASE 4 · Closed Beta + Steam Next Fest</text>
    <text x="1140" y="1080" text-anchor="end" fill="#ffdd44" font-size="13" font-weight="700">1–2 months</text>
    <text x="1140" y="1100" text-anchor="end" fill="#ff44cc" font-size="11" font-weight="700" letter-spacing="1">★ MAKE-OR-BREAK GATE</text>
    <text x="160" y="1106" fill="#ccbbee" font-size="13" font-style="italic" opacity="0.85">The single biggest wishlist driver in indie. Get it right or pivot.</text>

    <g fill="#ddccee" font-size="13">
      <text x="170" y="1140">▸ Recruit 50–200 testers via Discord, r/playmygame, TD subreddits</text>
      <text x="170" y="1162">▸ Instrument metrics: where players quit, unused towers, win rates by act</text>
      <text x="170" y="1184" fill="#ffdd44">▸ Submit to Steam Next Fest with stable public demo (free, huge boost)</text>
      <text x="170" y="1206">▸ Iterate from data, not opinions — kill darlings the metrics flag</text>
      <text x="170" y="1230" fill="#ff66aa">Gate: ≥3,000 wishlists post-Fest, or rework before launching.</text>
    </g>
  </g>

  <!-- ============== PHASE 5 ============== -->
  <g>
    <line x1="100" y1="1370" x2="140" y2="1370" stroke="rgba(140, 120, 200, 0.35)" stroke-width="2"/>
    <circle cx="100" cy="1370" r="20" fill="#44ffcc" filter="url(#glow)"/>
    <text x="100" y="1375" text-anchor="middle" fill="#1a0a2e" font-size="14" font-weight="900">5</text>

    <rect x="140" y="1270" width="1020" height="200" rx="10" fill="url(#cardBg)" stroke="#44ffcc" stroke-width="1.5" opacity="0.9"/>
    <text x="160" y="1300" fill="#66ffdd" font-size="20" font-weight="800">PHASE 5 · Polish + Release Prep</text>
    <text x="1140" y="1300" text-anchor="end" fill="#ffdd44" font-size="13" font-weight="700">2–3 months</text>
    <text x="160" y="1326" fill="#ccbbee" font-size="13" font-style="italic" opacity="0.85">Final shape. Bug bash, balance, localization, press kit.</text>

    <g fill="#ddccee" font-size="13">
      <text x="170" y="1360">▸ Bug bash + balance pass against beta data</text>
      <text x="170" y="1382">▸ 30–50 achievements · cloud saves · refreshed store screenshots</text>
      <text x="170" y="1404" fill="#ffdd44">▸ Localization: EN, ZH, DE, RU, ES (Chinese alone can 1.5–2× sales)</text>
      <text x="170" y="1426" fill="#ffdd44">▸ Press: Keymailer + 50–100 individual streamer/reviewer outreach</text>
      <text x="170" y="1450" fill="#44ffcc">Exit: zero P0/P1 bugs, balanced ladder, press kit ready, price set ($9.99–$14.99).</text>
    </g>
  </g>

  <!-- ============== PHASE 6 ============== -->
  <g>
    <line x1="100" y1="1590" x2="140" y2="1590" stroke="rgba(140, 120, 200, 0.35)" stroke-width="2"/>
    <circle cx="100" cy="1590" r="20" fill="#ffdd44" filter="url(#glow)"/>
    <text x="100" y="1595" text-anchor="middle" fill="#1a0a2e" font-size="14" font-weight="900">6</text>

    <rect x="140" y="1490" width="1020" height="200" rx="10" fill="url(#cardBg)" stroke="#ffdd44" stroke-width="1.5" opacity="0.9"/>
    <text x="160" y="1520" fill="#ffee88" font-size="20" font-weight="800">PHASE 6 · Launch + Post-Launch</text>
    <text x="1140" y="1520" text-anchor="end" fill="#ffdd44" font-size="13" font-weight="700">ongoing</text>
    <text x="160" y="1546" fill="#ccbbee" font-size="13" font-style="italic" opacity="0.85">Recommend 1.0 launch with permanent free demo (over Early Access).</text>

    <g fill="#ddccee" font-size="13">
      <text x="170" y="1580">▸ Realistic launch goal: ≥7,000 wishlists or expect &lt;$5K lifetime</text>
      <text x="170" y="1602">▸ Patch weekly month 1, then monthly</text>
      <text x="170" y="1624">▸ One major free content update at ~3 months — drives Steam visibility bump</text>
      <text x="170" y="1646" fill="#ffdd44">▸ Permanent free demo on store page · respond to every review for first 90 days</text>
    </g>
  </g>

  <!-- ============== Reality Checks Footer ============== -->
  <rect x="60" y="1710" width="1080" height="90" rx="8" fill="#1a0a2e" stroke="#ff4466" stroke-width="1" opacity="0.8"/>
  <text x="80" y="1734" fill="#ff6688" font-size="13" font-weight="800" letter-spacing="2">REALITY CHECKS</text>
  <g fill="#ddccee" font-size="12">
    <text x="80" y="1756">⚠ Median indie game earns &lt;$5K lifetime · top 10% earn $50K+ · TD genre is saturated</text>
    <text x="80" y="1774">⚠ Marketing &gt; engineering for revenue — plan 20–30% of total time on Steam page, devlogs, social, creator outreach</text>
    <text x="80" y="1792">⚠ You will cut a biome, 2–3 towers, probably co-op — plan for it · halve velocity for nights/weekends</text>
  </g>
</svg>
